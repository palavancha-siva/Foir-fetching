<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Official Bank Logos Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #ffffff;
            padding: 40px;
            display: flex;
            gap: 30px;
        }
        .logos-column {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        .logo-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        .logo-box {
            width: 44px;
            height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .logo-name {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }
    </style>
</head>
